<!DOCTYPE html>
<html>
    <head>
<title>Bank Account</title>
<link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="account-card">
            <h2>Withdraw Money</h2>

            <p>$ Amount: <span id="money-display">100</span></p>
            <p id="status-message">Withdraw Money Now</p>

            <button onclick="withdrawMoney()">Click to Withdraw</button>
        </div>

        <div id="account-card">
            <h2>Deposit Money</h2>

            <p>$ Amount: <span id="money-display">100</span></p>
            <p id="status-message">Deposit Money Now</p>

            <button onclick="depositMoney()">Click to Deposit</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
