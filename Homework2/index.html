<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Code Clicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <header>
                <h1>Code Clicker</h1>
                <h2 id="score-display">0 lines of code</h2>
                <button id="main-button" onClick="writeCode()">Write Code</button>
            </header>

            <main id="shop">
                    <h3>Hardware Store (Manual Upgrade)</h3>
                    <p>Current Click Power: <span id="power-display">1</span></p>
                    <button id="upgrade-button" onClick="buyKeyboard()">
                        Buy Mechanical Keyboard (Cost: <span id="cost-display">50</span>)
                    </button>
                 <button id="setup-button" onclick="buySetup()">
                 Buy Ergonomic Setup (+5 Click Power)
                  (Cost: <span id="setup-cost-display">250</span>)
                 </button>
                     <h3>Hiring Department (Auto Clicking)</h3>
                     <p>Active Interns: <span id="intern-display">0</span></p>
                     <button id="intern-button" onClick="buyIntern()">
                     Hire Intern (Cost: <span id="cost-intern-display">100</span>)
                    </button>
                <p>Senior Developers: <span id="developer-display">0</span></p>
                <button id="developer-button" onclick="buyDeveloper()">
                 Hire Senior Developer (+10 Lines/Second)
                (Cost: <span id="developer-cost-display">1000</span>)
                </button>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
